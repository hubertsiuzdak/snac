[project]
name = "snac"
version = "0.1.0"
description = "Multi-Scale Neural Audio Codec"
readme = "README.md"
authors = [
    { name = "Hubert Siuzdak", email = "hubert.siuzdak@gmail.com" }
]
requires-python = ">=3.12"
urls = { Homepage = "https://github.com/hubertsiuzdak/snac" }
dependencies = [
    "einops>=0.8.1",
    "huggingface-hub>=0.34.0,<1.0",
    "numpy>=2.4.1",
    "torch>=2.9.1",
    "soundfile>=0.12.1",
]

[dependency-groups]
dev = [
    "scipy>=1.17.0",
]


# Build System

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "snac"
module-root = ""


# CUDA Configuration

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

